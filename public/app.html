<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E1111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IRONIQ">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo-apple.png">
  <title>IRONIQ — Treinos Inteligentes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://firebaseapp.com">
  <link rel="dns-prefetch" href="https://firebase.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  APP SHELL — todo o HTML das páginas é injetado por js/templates.js    -->
  <!--  Aqui fica apenas: root #app, loading screen, imports e ordem de load  -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div id="app" class="auth-layout">
    <!-- Loading screen — fica visível até o Firebase confirmar sessão -->
    <div id="app-loading" style="position:fixed;inset:0;z-index:9999;background:#0E1111;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div style="width:48px;height:48px;border:3px solid #1F2525;border-top-color:#CCFF00;border-radius:50%;animation:appSpin 0.8s linear infinite;"></div>
      <p style="margin-top:16px;color:#888;font-size:14px;">Carregando...</p>
    </div>
  </div>

  <!-- Libs externas -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!--  ORDEM DE CARREGAMENTO (importa — dependências antes de quem usa):     -->
  <!--  utils → state → firebase-init → services → templates (injeta o DOM)  -->
  <!--  → modules → router → auth (dispara autologin) → init                 -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/services/uid-map.js"></script>
  <script src="js/services/firestore.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/modules/admin-core.js"></script>
  <script src="js/modules/admin-usuarios.js"></script>
  <script src="js/modules/admin-comissoes.js"></script>
  <script src="js/modules/admin-config.js"></script>
  <script src="js/modules/chat.js"></script>
  <script src="js/modules/comissoes.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/protocolo-form.js"></script>
  <script src="js/modules/protocolo-aceite.js"></script>
  <script src="js/modules/protocolo-render.js"></script>
  <script src="js/modules/personal-alunos.js"></script>
  <script src="js/modules/personal-review.js"></script>
  <script src="js/modules/personal-dieta.js"></script>
  <script src="js/modules/personal-modal.js"></script>
  <script src="js/modules/personal-kanban.js"></script>
  <script src="js/modules/perfil.js"></script>
  <script src="js/modules/treino-ativo.js"></script>
  <script src="js/modules/evolucao.js"></script>
  <script src="js/modules/planos.js"></script>
  <script src="js/modules/dieta.js"></script>
  <script src="js/modules/agenda.js"></script>
  <script src="js/router.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
